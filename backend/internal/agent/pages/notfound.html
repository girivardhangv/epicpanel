<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorry, Wrong Page</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { text-align: center; background: #1e293b; padding: 3rem; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border-top: 4px solid #38bdf8; }
        h1 { font-size: 2.5rem; margin-bottom: 1rem; color: #38bdf8; }
        p { font-size: 1.1rem; color: #cbd5e1; }
        .code { margin-top: 1.5rem; font-size: 0.9rem; color: #64748b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sorry, Wrong Page</h1>
        <p>The page you are looking for does not exist or has been moved.</p>
        <div class="code">Error 404</div>
    </div>
</body>
</html>
