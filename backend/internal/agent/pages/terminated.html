<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Site Terminated</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #0f1115; color: #e6e8eb; text-align: center; padding: 2rem;
  }
  .card { max-width: 34rem; }
  h1 { font-size: 1.6rem; margin: 0 0 .75rem; letter-spacing: .02em; }
  p { color: #9aa3ad; line-height: 1.6; margin: .4rem 0; }
  .code { font-size: .8rem; color: #6b7280; margin-top: 2rem; }
</style>
</head>
<body>
<main class="card">
  <h1>This site has been terminated</h1>
  <p>The account associated with this website has been terminated and its
  services have been deactivated.</p>
  <p>If you believe this is an error, please contact the site operator.</p>
  <p class="code">HTTP 410 &mdash; Gone</p>
</main>
</body>
</html>
