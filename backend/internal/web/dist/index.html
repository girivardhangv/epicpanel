<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EpicPanel</title>
</head>
<body style="font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background:#f8fafc; color:#0f172a;">
  <div style="text-align:center; max-width: 32rem;">
    <h1>EpicPanel</h1>
    <p>The web interface has not been built into this binary.</p>
    <p style="color:#64748b; font-size:.9rem;">Run <code>npm run build</code> in <code>frontend/</code>, copy
    <code>frontend/dist/*</code> into <code>backend/internal/web/dist/</code>, then rebuild the panel —
    or set <code>EPICPANEL_DIST_DIR</code> to serve an external build.</p>
  </div>
</body>
</html>
