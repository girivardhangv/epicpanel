name = "epicpanel-installer"
main = "installer-worker.js"
compatibility_date = "2026-09-01"

# Custom domains: add both zones to your Cloudflare account first, then these
# custom_domain routes attach automatically on `wrangler deploy`.
routes = [
  { pattern = "get.epichostly.in", custom_domain = true },
  { pattern = "downloads.epichostly.in", custom_domain = true },
]

[[r2_buckets]]
binding = "RELEASES"
bucket_name = "epicpanel-releases"

[vars]
GET_HOST = "get.epichostly.in"
DOWNLOADS_HOST = "downloads.epichostly.in"

[observability]
enabled = true
