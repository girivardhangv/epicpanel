# EpicPanel log rotation.
# Install: install -m 0644 deploy/logrotate-epicpanel.conf /etc/logrotate.d/epicpanel
#
# journald already caps journal size (SystemMaxUse in /etc/systemd/journald.conf);
# this file covers hosts that additionally log to /var/log/epicpanel (file
# transport) and the nginx access logs for the panel vhost.

/var/log/epicpanel/*.log {
    daily
    rotate 14
    size 50M
    missingok
    notifempty
    compress
    delaycompress
    dateext
    copytruncate
    su root root
}

/var/log/nginx/epicpanel*.log {
    daily
    rotate 14
    size 100M
    missingok
    notifempty
    compress
    delaycompress
    dateext
    sharedscripts
    postrotate
        [ -f /var/run/nginx.pid ] && kill -USR1 "$(cat /var/run/nginx.pid)" || true
    endscript
}
